<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Privacidad: el navegador bloquea cualquier carga o conexión fuera del propio origen. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; object-src 'none'; base-uri 'self'">
  <title>Gastos</title>
  <meta name="description" content="Registro personal de gastos. Los datos se guardan solo en este dispositivo.">
  <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111418" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Gastos">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar"><h1 id="title">Nuevo gasto</h1></header>

  <main>
    <!-- ===== Registrar / editar ===== -->
    <section id="view-nuevo" class="view">
      <form id="expense-form" novalidate autocomplete="off">
        <div class="card amount-card">
          <label class="grow">Importe
            <input id="f-amount" class="amount" type="text" inputmode="decimal" placeholder="0.00" enterkeyhint="next">
          </label>
          <label>Moneda
            <select id="f-currency"></select>
          </label>
        </div>

        <div class="card">
          <label>Concepto
            <input id="f-concept" type="text" maxlength="120" placeholder="¿En qué gastaste?" autocapitalize="sentences">
          </label>
          <div class="row">
            <label>Categoría
              <select id="f-category"></select>
            </label>
            <label id="subcategory-field">Subcategoría
              <select id="f-subcategory"></select>
            </label>
          </div>
          <div class="row">
            <label>Medio de pago
              <select id="f-method"></select>
            </label>
            <label id="account-field">Tarjeta / cuenta
              <select id="f-account"></select>
            </label>
          </div>
          <label>Comercio
            <input id="f-merchant" type="text" maxlength="80" list="merchants-list" placeholder="Opcional" autocapitalize="words">
            <datalist id="merchants-list"></datalist>
          </label>
        </div>

        <div class="card">
          <label>Fecha
            <input id="f-date" type="date">
          </label>
          <div class="row">
            <label>Cantidad
              <input id="f-quantity" type="text" inputmode="decimal">
            </label>
            <label>Unidad
              <select id="f-unit"></select>
            </label>
          </div>
          <label>Observación
            <textarea id="f-note" rows="2" maxlength="300" placeholder="Opcional"></textarea>
          </label>
        </div>

        <p id="form-error" class="error" role="alert" hidden></p>
        <button id="btn-save" type="submit" class="btn primary block">Guardar gasto</button>
        <button id="btn-cancel" type="button" class="btn block" hidden>Cancelar</button>
        <button id="btn-delete" type="button" class="btn danger block" hidden>Eliminar gasto</button>
      </form>
    </section>

    <!-- ===== Historial ===== -->
    <section id="view-historial" class="view" hidden>
      <div class="searchrow">
        <input id="h-q" type="search" placeholder="Buscar…" aria-label="Buscar gastos" enterkeyhint="search">
        <button id="h-toggle" type="button" class="btn" aria-expanded="false">Filtros</button>
      </div>
      <div id="h-filters" class="card" hidden>
        <div class="row">
          <label>Desde <input id="h-from" type="date"></label>
          <label>Hasta <input id="h-to" type="date"></label>
        </div>
        <div class="row">
          <label>Categoría <select id="h-category"></select></label>
          <label>Medio de pago <select id="h-method"></select></label>
        </div>
        <div class="row">
          <label>Tarjeta / cuenta <select id="h-account"></select></label>
          <label>Comercio <select id="h-merchant"></select></label>
        </div>
        <button id="h-clear" type="button" class="btn block">Limpiar filtros</button>
      </div>
      <p id="h-summary" class="muted"></p>
      <div id="h-list"></div>
      <button id="h-more" type="button" class="btn block" hidden>Mostrar más</button>
    </section>

    <!-- ===== Resumen ===== -->
    <section id="view-resumen" class="view" hidden>
      <div class="monthnav">
        <button id="m-prev" type="button" class="btn" aria-label="Mes anterior">‹</button>
        <strong id="m-label"></strong>
        <button id="m-next" type="button" class="btn" aria-label="Mes siguiente">›</button>
      </div>
      <div id="summary-body"></div>
    </section>

    <!-- ===== Ajustes ===== -->
    <section id="view-ajustes" class="view" hidden>
      <h2>Exportar a Excel</h2>
      <div class="card">
        <p class="muted">Una fila por gasto. Incluye todos los gastos registrados.</p>
        <div class="row">
          <button id="btn-xlsx" type="button" class="btn primary">Excel (.xlsx)</button>
          <button id="btn-csv" type="button" class="btn">CSV</button>
        </div>
      </div>

      <h2>Backup</h2>
      <div class="card">
        <p class="muted" id="backup-info"></p>
        <div class="row">
          <button id="btn-backup" type="button" class="btn primary">Crear backup</button>
          <button id="btn-restore" type="button" class="btn">Restaurar…</button>
        </div>
        <input id="restore-file" type="file" accept=".json,application/json" hidden>
      </div>

      <h2>Importar gastos</h2>
      <div class="card">
        <p class="muted" id="import-info"></p>
        <div class="row">
          <button id="btn-import" type="button" class="btn">Importar archivo…</button>
          <button id="btn-undo-import" type="button" class="btn danger" hidden>Deshacer importación</button>
        </div>
        <input id="import-file" type="file" accept=".json,application/json" hidden>
      </div>

      <h2>Catálogos</h2>
      <div id="settings-lists"></div>

      <p class="muted center" id="about"></p>
    </section>
  </main>

  <nav class="tabbar" aria-label="Secciones">
    <button type="button" data-view="nuevo" class="active">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Registrar
    </button>
    <button type="button" data-view="historial">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Historial
    </button>
    <button type="button" data-view="resumen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>Resumen
    </button>
    <button type="button" data-view="ajustes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>Ajustes
    </button>
  </nav>

  <div id="toast" role="status" aria-live="polite" hidden></div>

  <div id="modal" class="modal" hidden>
    <form class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h3 id="modal-title"></h3>
      <p id="modal-message"></p>
      <input id="modal-input" type="text" maxlength="80">
      <div class="row">
        <button id="modal-cancel" type="button" class="btn">Cancelar</button>
        <button id="modal-ok" type="submit" class="btn primary">Aceptar</button>
      </div>
    </form>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
